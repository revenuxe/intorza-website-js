<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    
    <!-- Primary Meta Tags (fallback - React Helmet overrides per page) -->
    <title>Intorza - Interior Design Software | Quotation & Invoice Maker</title>
    <meta name="description" content="Intorza is India's #1 interior design project management software. Create professional quotations, generate GST invoices, manage clients & team collaboration. Start Free!" />
    <link rel="canonical" href="https://intorza.com" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    
    <!-- Mobile & PWA -->
    <meta name="theme-color" content="#7c3aed" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Intorza" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://intorza.com" />
    <meta property="og:title" content="Intorza - Interior Design Software | Quotation & Invoice Maker" />
    <meta property="og:description" content="India's #1 interior design project management software. Create quotations, generate invoices, manage clients & team. Start Free!" />
    <meta property="og:image" content="https://intorza.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Intorza" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@intorza" />
    <meta name="twitter:title" content="Intorza - Interior Design Software | Quotation & Invoice Maker" />
    <meta name="twitter:description" content="India's #1 interior design software. Create professional quotations, invoices & manage clients. Start Free!" />
    <meta name="twitter:image" content="https://intorza.com/og-image.png" />

    <!-- Single Organization Schema (global, not page-specific) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://intorza.com/#organization",
      "name": "Intorza",
      "url": "https://intorza.com",
      "logo": {
        "@type": "ImageObject",
        "url": "https://intorza.com/intorza-logo.webp",
        "width": 512,
        "height": 512
      },
      "description": "Interior design project management software for quotations, invoices, and client management",
      "email": "intorza.com@gmail.com",
      "foundingDate": "2024",
      "sameAs": [
        "https://twitter.com/intorza",
        "https://linkedin.com/company/intorza",
        "https://instagram.com/intorza"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "email": "intorza.com@gmail.com",
        "availableLanguage": ["English", "Hindi"]
      }
    }
    </script>

    <!-- Single WebSite Schema with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://intorza.com/#website",
      "url": "https://intorza.com",
      "name": "Intorza",
      "publisher": { "@id": "https://intorza.com/#organization" },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://intorza.com/blog?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://app.intorza.com" />
    <link rel="preload" as="image" href="/intorza-logo.webp" type="image/webp" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
